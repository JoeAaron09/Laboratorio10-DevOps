
name: deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener hash del commit
        id: commit
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$SHORT_SHA"

          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.commit.outputs.sha }} \
            -t "${{ steps.commit.outputs.image }}" \
            ./app

      - name: Ejecutar contenedor y smoke test
        run: |
          IMAGE="${{ steps.commit.outputs.image }}"

          docker run -d \
            --name pagosya-test \
            -p 8080:8000 \
            "$IMAGE"

          echo "Esperando que la aplicación responda..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health-error | grep -qx "ok"; then
              echo "Smoke test exitoso"
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: El smoke test falló"
          docker logs pagosya-test
          exit 1

      - name: Publicar imagen en GHCR
        if: success()
        run: |
          IMAGE="${{ steps.commit.outputs.image }}"

          docker push "$IMAGE"

          echo "Imagen publicada correctamente: $IMAGE"
